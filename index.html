<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
        .navbar {
            --bs-navbar-color: #3B2F2F;
            --bs-navbar-hover-color: #3B2F2F;
            --bs-navbar-active-color: #3B2F2F;
        }

        .hero-section {
            min-height: calc(100vh - 72px);
            color: #FFEBD4;
            background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("assets/images/hero.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .hero-section h1 {
            color: #FFEBD4;
            font-family: "Handlee", cursive;
        }

        .hero-section p {
            color: #FFEBD4 !important;
        }

        .hero-section .btn-light {
            color: #3B2F2F;
        }

        @media (max-width: 991.98px) {
            .hero-section {
                min-height: calc(100vh - 56px);
            }
        }
    </style>
    <title>Seven Seas Spa</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-white" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="assets/images/logo.png" alt="Seven Seas Spa logo" width="30" height="30" />
                <span>Seven Seas Spa</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="services.html">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero-section d-flex align-items-center justify-content-center text-center px-3"
            aria-labelledby="hero-title">
            <div class="container">
                <p class="text-uppercase fw-semibold mb-3">Seven Seas Spa</p>
                <h1 id="hero-title" class="display-3 fw-bold mb-4">Relax, restore, and reconnect.</h1>
                <p class="lead mx-auto mb-4" style="max-width: 42rem;">
                    Escape the everyday with restorative treatments inspired by the calm of the sea.
                </p>
                <a class="btn btn-light btn-lg px-4" href="#book-now">Book your treatment</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
